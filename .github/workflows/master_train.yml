# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - train

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '22.x'

     # - name: npm install, build, and test
     #   run: |
     #     npm install
     #     npm run build --if-present
     #     npm run test --if-present
      
      - name: Install dependencies
        run: npm install

      - name: Build React App
        run: npm run build
      
      - name: Verify Build Folder
        run: |
          if [ ! -d "build" ]; then
            echo "Build folder not found! Build failed."
            exit 1
          fi

      - name: Zip build folder for deployment
        run: zip release.zip build -r


      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: release.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'Production'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Unzip artifact for deployment
        run: unzip release.zip
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_EB92825F34B84E1D8021C61B42A02D94 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_E372FAF1A1754050AB28A57449588B75 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_DD415364FB9F4E9EB40D872DFF1FEF90 }}

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'train'
          slot-name: 'Production'
          package: .
          
